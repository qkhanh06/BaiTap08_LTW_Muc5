<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Danh mục và sản phẩm GraphQL</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body th:attr="data-endpoint=@{/graphql}"><nav><a th:href="@{/home}">Trang chủ</a><a th:href="@{/graphql/categories}">Danh mục GraphQL</a><a th:href="@{/graphql/products}">Sản phẩm GraphQL</a><a th:href="@{/admin/categories}">REST phần 4</a><a th:href="@{/graphiql}">GraphiQL</a></nav>
<main><p id="message" role="status" aria-live="polite"></p><section id="catalog" data-mode="products"><h1>Quản lý sản phẩm</h1><form id="search-form" class="toolbar"><label>Tìm theo tên <input id="keyword" type="search"></label><label>Số dòng <select id="size"><option>5</option><option>10</option><option>20</option></select></label><button>Tìm kiếm</button></form><div class="table-wrap"><table><thead><tr><th>ID</th><th>Tên sản phẩm</th><th>Giá</th><th>Số lượng</th><th>Danh mục</th><th>Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="previous" type="button">Trang trước</button><span id="page-info"></span><button id="next" type="button">Trang sau</button></div><h2 id="form-title">Thêm sản phẩm</h2><form id="editor"><input name="id" type="hidden"><label>Tên sản phẩm<input name="productName" required maxlength="500"></label><label>Danh mục<select name="categoryId" required></select></label><label>Giá<input name="unitPrice" type="number" min="0" step="any" required></label><label>Số lượng<input name="quantity" type="number" min="0" step="1" required></label><label>Giảm giá (%)<input name="discount" type="number" min="0" max="100" step="any" value="0" required></label><label>Trạng thái<select name="status"><option value="1">Đang bán</option><option value="0">Ngừng bán</option></select></label><label>Ảnh (đường dẫn hoặc URL)<input name="images" maxlength="200"></label><label>Mô tả<textarea name="description" maxlength="500"></textarea></label><div><button id="save">Lưu</button><button id="cancel" type="button">Hủy / Thêm mới</button></div></form></section></main><script th:src="@{/js/catalog.js}" defer></script></body></html>
